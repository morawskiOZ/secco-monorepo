name: Deploy LP to Cloudflare Workers

# Replaces "Build and Push LP Image" (Docker -> GHCR -> Kubernetes).
# Requires repository secrets CLOUDFLARE_WORKERS_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# See secco_LP/docs/hosting-cloudflare-workers.md.

on:
  # Content saved in the CMS (a commit under secco_LP/content on main) goes
  # straight to stage2. Production is only ever deployed by hand.
  push:
    branches: [main]
    paths:
      - "secco_LP/content/**"
      - "secco_LP/cms/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "stage2 = content sections + CMS + drafts (workers.dev), staging = production build on workers.dev, production = www.seccostudio.com"
        required: true
        default: stage2
        type: choice
        options: [stage2, staging, production]
      version:
        description: "Explicit semver for the production tag (optional). Blank = auto patch-bump from last lp-v*.*.* tag."
        required: false
        type: string

env:
  # A push has no inputs: it always means stage2.
  TARGET: ${{ inputs.environment || 'stage2' }}

concurrency:
  group: deploy-lp-${{ inputs.environment || 'stage2' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: secco_LP

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        if: inputs.environment == 'production'
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            if ! echo "$VERSION" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
              echo "::error::Invalid semver: $VERSION"
              exit 1
            fi
          else
            git fetch --tags --quiet
            LAST=$(git tag -l 'lp-v*' | grep -E '^lp-v[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,4}$' | sort -V | tail -1)
            if [ -z "$LAST" ]; then
              VERSION="0.0.1"
            else
              IFS=. read -r MAJ MIN PAT <<< "${LAST#lp-v}"
              VERSION="$MAJ.$MIN.$((PAT+1))"
            fi
          fi
          if git rev-parse "lp-v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag lp-v$VERSION already exists"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: secco_LP/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test && npm run check:worker

      - name: Build site
        env:
          # The real Turnstile widget only allows the production hostnames:
          # workers.dev builds use Cloudflare's always-pass test key.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ inputs.environment == 'production' && secrets.PUBLIC_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
        run: |
          if [ "$TARGET" = "stage2" ]; then
            # Content sections, CMS admin, drafts; hidden from search engines.
            export SECCO_CONTENT=1 SECCO_DRAFTS=1 SECCO_NOINDEX=1
          fi
          # Going live with the content sections on production = adding
          # SECCO_CONTENT=1 for production here (see docs/content-and-cms.md).
          npm run build

      - name: Deploy
        env:
          # wrangler only reads CLOUDFLARE_API_TOKEN; the secret keeps the name
          # of the Workers-scoped token to tell it apart from the zone-only one.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          case "$TARGET" in
            production) npx wrangler deploy --env="" ;;
            staging|stage2) npx wrangler deploy --env "$TARGET" ;;
            *) echo "::error::Unknown environment: $TARGET"; exit 1 ;;
          esac

      - name: Create git tag
        if: inputs.environment == 'production'
        working-directory: .
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "lp-v$VERSION" -m "LP release v$VERSION"
          git push origin "lp-v$VERSION"
